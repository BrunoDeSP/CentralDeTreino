<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Central de Treino</title>
  <meta name="description" content="Treinos da semana, ciclo e histórico.">

  <meta name="theme-color" content="#ECEFF2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C2129" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Treino">

  <link rel="preload" href="fontes/archivo-variavel.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="conteudo" class="conteudo" tabindex="-1">
    <p class="texto-apoio">Carregando…</p>
  </main>

  <nav class="abas" aria-label="Seções">
    <a href="#/hoje" data-aba="hoje">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><circle cx="12" cy="12" r="3" /></svg>
      <span>Hoje</span>
    </a>
    <a href="#/ciclo" data-aba="ciclo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3" /><path d="M19.5 4.5v4h-4" /></svg>
      <span>Ciclo</span>
    </a>
  </nav>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <dialog id="confirmacao" class="dialogo" aria-labelledby="dialogo-titulo">
    <form method="dialog">
      <h2 id="dialogo-titulo" data-titulo></h2>
      <p data-texto></p>
      <div class="dialogo-acoes">
        <button class="botao botao--secundario" value="nao">Cancelar</button>
        <button class="botao" value="sim" data-confirmar>Confirmar</button>
      </div>
    </form>
  </dialog>

  <noscript>Ative o JavaScript do navegador para usar o app.</noscript>
</body>
</html>
